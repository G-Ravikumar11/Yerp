name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (e.g. https://your-app.up.railway.app)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

jobs:
  # =========================================================================
  # 1. Android Build (Ubuntu Runner) -> Produces .apk (Direct Install) & .aab (Play Store)
  # =========================================================================
  build-android:
    name: Build Android (APK & Play Store AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package.json
            mobile/package.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm install
          npm --prefix ../mobile install

      - name: Build Web Assets for Mobile
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || 'https://yerp-production.up.railway.app' }}
        run: npm run build:mobile

      - name: Initialize Android Platform & Sync Capacitor
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # Optional secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # (a signed release bundle) and GOOGLE_SERVICES_JSON (push notifications). Without them the build is unsigned
      # and push stays off.
      - name: Add Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json; fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yerp-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yerp-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Build Debug APK (For Immediate Phone Testing)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release App Bundle (AAB for Google Play Store)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yerp-Android-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Yerp-Android-PlayStore-AAB
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  # =========================================================================
  # 2. iOS Build (macOS Apple Silicon Runner) -> Produces Xcode Archive
  # =========================================================================
  build-ios:
    name: Build iOS (Apple App Store / TestFlight Archive)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package.json
            mobile/package.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm install
          npm --prefix ../mobile install

      - name: Build Web Assets for Mobile
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || 'https://yerp-production.up.railway.app' }}
        run: npm run build:mobile

      - name: Initialize iOS Platform & Sync Capacitor
        working-directory: mobile
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Add camera and photo permissions to Info.plist
        working-directory: mobile/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Y ERP uses the camera to attach site photos and documents.'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Y ERP lets you pick photos to attach to logs and measurements.'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || true

      # Signing is optional: with no Apple secrets set, the unsigned archive below is produced as before.
      # Secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_PROFILE_NAME, IOS_TEAM_ID,
      # and (for TestFlight upload) APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8_BASE64.
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/yerp.mobileprovision"

      - name: Build signed Xcode Archive
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          mkdir -p ../../build
          xcodebuild -workspace App.xcworkspace             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             DEVELOPMENT_TEAM="$TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             -archivePath ../../build/App.xcarchive             clean archive
          cat > ../../build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.yerp.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath ../../build/App.xcarchive             -exportOptionsPlist ../../build/ExportOptions.plist             -exportPath ../../build/ipa

      - name: Upload signed IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Yerp-iOS-IPA
          path: mobile/build/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          if [ -z "$KEY_ID" ]; then echo "No App Store Connect key set; skipping TestFlight upload."; exit 0; fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app --type ios -f mobile/build/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Build unsigned Xcode Archive
        if: steps.signing.outputs.enabled != 'true'
        working-directory: mobile/ios/App
        run: |
          mkdir -p ../../build
          xcodebuild -workspace App.xcworkspace             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             -archivePath ../../build/App.xcarchive             clean archive

      - name: Compress iOS Archive
        working-directory: mobile/build
        run: zip -r Yerp-iOS-Archive.zip App.xcarchive

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Yerp-iOS-Archive
          path: mobile/build/Yerp-iOS-Archive.zip
          retention-days: 14
