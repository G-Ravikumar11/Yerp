name: CI

on:
  push:
  pull_request:

jobs:
  conflict-markers:
    name: No merge-conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on leftover markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!*.md' ':!*.lock' ':!package-lock.json'; then
            echo "Merge-conflict markers found above." >&2
            exit 1
          fi

  # The suite is split into shares that run side by side, and each share uses every core of its machine (each worker
  # has its own throwaway database), so the whole run takes minutes, not hours.
  backend:
    name: Backend tests (${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -n auto --dist loadfile
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
          COOKIE_SECURE: 'false'
          SECRET_KEY: ci-only-secret-key

  # The live site runs on Postgres; the test suite on throwaway SQLite files. Start-up's schema steps are non-fatal by
  # design (a failed one is recorded, the server still starts), so here they must all succeed on Postgres, twice: on an
  # empty database (a new install) and on one the previous commit set up (an upgrade, as every deploy is). After each,
  # every table and column the models define must exist - a column added without its migration fails here, not live.
  migrations:
    name: Database migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fresh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COOKIE_SECURE: 'false'
      SECRET_KEY: ci-only-secret-key
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: New install - an empty database
        run: python backend/scripts/check_migrations.py
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/fresh?sslmode=disable
      - name: Upgrade - the previous commit sets the database up, this one starts on it
        run: |
          psql -h localhost -U ci -d fresh -c "CREATE DATABASE upgrade"
          prev="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$prev" ] || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then prev="$(git rev-parse HEAD~1)"; fi
          echo "Previous commit: $prev"
          git worktree add --detach /tmp/previous "$prev"
          pip install -q -r /tmp/previous/backend/requirements.txt
          # The previous commit's own start-up, with this commit's checker run from its tree (it may predate the checker).
          cp backend/scripts/check_migrations.py /tmp/previous/backend/scripts/check_migrations.py
          python /tmp/previous/backend/scripts/check_migrations.py || echo "(the previous commit's own schema had problems - shown above; what matters is the next step)"
          pip install -q -r backend/requirements-dev.txt
          python backend/scripts/check_migrations.py
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/upgrade?sslmode=disable

  # One check that says PASS or FAIL for the backend: every test shard, the migrations and the conflict check. This is the
  # check to require - in the branch protection rules for merging, and in Railway's "Wait for CI" for deploying - so a
  # failed backend check stops a merge or a deploy. It runs even when a job before it failed, to say so plainly.
  backend-checks:
    name: Backend checks (PASS/FAIL)
    if: always()
    needs: [conflict-markers, backend, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          {
            echo "## Backend checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| No merge-conflict markers | ${{ needs.conflict-markers.result }} |"
            echo "| Backend test suite (6 shards) | ${{ needs.backend.result }} |"
            echo "| Database migrations (Postgres) | ${{ needs.migrations.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.conflict-markers.result }}" = success ] && [ "${{ needs.backend.result }}" = success ] && [ "${{ needs.migrations.result }}" = success ]; then
            echo "**PASS** - safe to merge and deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "PASS"
          else
            echo "**FAIL** - do not merge or deploy until this is fixed." >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: conflict-markers=${{ needs.conflict-markers.result }} backend=${{ needs.backend.result }} migrations=${{ needs.migrations.result }}" >&2
            exit 1
          fi

  # The biometric office program is C# that the office computer compiles with the .NET Framework's own compiler, so it is
  # built and tested the same way here, on Windows: if it compiles here it compiles on any office PC from Windows 7 up.
  biometric:
    name: Biometric office program (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
        working-directory: tools/biometric_sync
    steps:
      - uses: actions/checkout@v4
      - name: Build it as SETUP.bat does
        run: call build.bat force
      - name: Run its tests
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /main:YerpBiometric.SelfTest /out:test\selftest.exe /r:System.Web.Extensions.dll YerpBiometric.cs test\SelfTest.cs || exit /b 1
          test\selftest.exe

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
