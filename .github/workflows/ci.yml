name: CI

on:
  push:
  pull_request:

jobs:
  conflict-markers:
    name: No merge-conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on leftover markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!*.md' ':!*.lock' ':!package-lock.json'; then
            echo "Merge-conflict markers found above." >&2
            exit 1
          fi

  # The suite is split into shares that run side by side, and each share uses every core of its machine (each worker
  # has its own throwaway database), so the whole run takes minutes, not hours.
  backend:
    name: Backend tests (${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -n auto --dist loadfile
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
          COOKIE_SECURE: 'false'
          SECRET_KEY: ci-only-secret-key

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
