# How Railway builds the app (railway.json picks the Nixpacks builder).
#
# Nixpacks sees requirements.txt at the root and sets up Python. Node is added here only to compile the
# React app into frontend/dist, which the server then serves at /next/. The compiled app is not committed.
#
# Node comes from its own Nix snapshot. The snapshot Nixpacks pins for Python (November 2024) only has Node 22.10
# and 23.1, and Vite 8 needs 22.12 or newer. This one is nixos-25.11 as of 30 June 2026, giving Node 24.18, the same
# major version the app is developed on. Python stays on Nixpacks' own snapshot.
#
# The npm commands run without LD_LIBRARY_PATH. Nixpacks points it at the Python snapshot's C++ library (for pip
# wheels), and Node 24, built against a newer one, refuses to start with the old library in front of its own.

[phases.node]
nixPkgs = ["nodejs_24"]
nixpkgsArchive = "b6018f87da91d19d0ab4cf979885689b469cdd41"

[phases.build]
dependsOn = ["install", "node"]
cmds = ["cd frontend && env -u LD_LIBRARY_PATH npm ci --include=dev && env -u LD_LIBRARY_PATH npm run build"]
