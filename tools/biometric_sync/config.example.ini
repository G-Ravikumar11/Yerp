; SETUP.bat makes config.ini for you. To do it by hand: copy this file to config.ini (same folder) and fill it in.
; config.ini is never sent anywhere or put in git.

[yerp]
; The address of Y ERP, no slash at the end.
url = https://yalavartiinfra.com
; The key from Y ERP: People > Attendance > Biometric > Make the key. Paste it here.
api_key = PASTE-THE-KEY-HERE
; How often to send, in seconds (30 at the least).
every_seconds = 60
; How far back to re-read each time, for a machine that uploads late. Y ERP ignores what it already has.
overlap_minutes = 30

[database]
; The SQL Server that holds eTimeTrackLite. On the same computer: localhost   Named instance: localhost\SQLEXPRESS
server = localhost
name = etimetracklite
; A READ-ONLY SQL login made for this program. Leave both empty to sign in as the Windows account the program runs as
; (the every-minute task runs as SYSTEM, which SETUP.bat gives read access when SQL Server allows Windows sign-in only).
user = yerp_reader
password = PUT-ITS-PASSWORD-HERE
; auto = the machines' raw logs (DeviceLogs_<month>_<year>) when they exist, otherwise the daily AttendanceLogs table.
; Or force one: devicelogs / attendancelogs
source = auto
; code = send each person's HR employee code (EmployeeCode).  device = send the number enrolled on the machine.
send = code
