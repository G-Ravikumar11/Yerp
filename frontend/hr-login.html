<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HR Login - Billing</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f8fafc">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(37, 99, 235, 0.05), transparent);
        }
        .auth-container { width: 100%; max-width: 440px; padding: 24px; }
        .auth-card {
            background: rgba(248, 250, 252, 0.95);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.1);
        }
        .brand { text-align: center; margin-bottom: 40px; }
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #2563eb, #7877c6);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
        }
        .brand h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .brand p { font-size: 0.85rem; color: #94a3b8; }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #333;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }
        .btn-google:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); transform: translateY(-1px); }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }
        .success-msg {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }
        .info-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.5;
        }
        .link-home { text-align: center; margin-top: 24px; }
        .link-home a { color: #64748b; text-decoration: none; font-size: 0.8rem; }
        .link-home a:hover { color: #2563eb; }
        .super-link {
            text-align: center;
            margin-top: 16px;
        }
        .super-link a {
            color: #7877c6;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .super-link a:hover { color: #2563eb; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="mobile.css?v=43">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon">A</div>
                <h1>HR Portal Login</h1>
                <p>Manage your invoices effortlessly</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="color:#94a3b8;font-size:0.85rem;">Signing you in...</p>
            </div>

            <div id="login-content">
                <p style="text-align:center;color:var(--text-secondary);padding:20px;">Redirecting to login...</p>
                <meta http-equiv="refresh" content="0;url=/login.html">
                <script>window.location.href = '/login.html';</script>
            </div>

            <div class="super-link">
                <a href="/superadmin-login.html">Super Admin Login</a>
                <a href="/employee-login.html" style="display:block;margin-top:8px;color:#64748b;font-size:0.85rem;">Employee Portal Login</a>
            </div>
            <div class="link-home">
                <a href="/">Back to home</a>
            </div>
        </div>
    </div>

    <script>
        window.location.href = '/login.html';
    </script>
</body>
</html>
