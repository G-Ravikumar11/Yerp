<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Billing - Employee Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
            dark: { 800:'#e2e8f0',900:'#f1f5f9',950:'#f8fafc' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f8fafc 100%); }
    .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 25px 60px rgba(0,0,0,0.1); }
    .glow { box-shadow: 0 25px 60px rgba(0,0,0,0.1); }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(99,102,241,0.3); border-color: #6366f1; }
    .float-particle { position: absolute; border-radius: 50%; background: rgba(99,102,241,0.08); animation: float 20s infinite ease-in-out; }
    @keyframes float { 0%,100% { transform: translateY(0) translateX(0); } 25% { transform: translateY(-30px) translateX(20px); } 50% { transform: translateY(-10px) translateX(-15px); } 75% { transform: translateY(-40px) translateX(10px); } }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.04), transparent); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  </style>
    <link rel="stylesheet" href="mobile.css?v=43">
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <div class="float-particle w-72 h-72 -top-20 -left-20" style="animation-delay:0s;"></div>
  <div class="float-particle w-96 h-96 -bottom-32 -right-32" style="animation-delay:5s;"></div>
  <div class="float-particle w-48 h-48 top-1/3 right-1/4" style="animation-delay:10s;"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-4">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        </div>
        <span class="text-2xl font-bold text-gray-900">Billing</span>
      </div>
      <h1 class="text-xl font-semibold text-gray-700">Employee Portal</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to access your dashboard</p>
    </div>

    <div class="glass rounded-2xl p-8 glow">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none input-glow transition-all" placeholder="you@company.com" required autofocus>
          </div>
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <input type="password" id="password" class="w-full pl-10 pr-12 py-3 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none input-glow transition-all" placeholder="Enter your password" required>
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors" onclick="togglePassword()">
              <svg id="eyeOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>
        <div id="locationStatus" class="flex items-center gap-2 text-xs text-gray-500 mb-4">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Detecting location...</span>
        </div>
        <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm text-center"></div>
        <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-brand-500/25" id="loginBtn">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="hidden"><svg class="animate-spin h-5 w-5 mx-auto text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></span>
        </button>
      </form>

      <!-- Staff sign in with a password here, so this is where lockouts happen. -->
      <div class="text-center mt-5">
        <button type="button" id="forgotLink" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">
          Forgot your password?
        </button>
      </div>

      <div id="forgotBox" class="hidden mt-4 pt-4 border-t border-gray-200">
        <label class="block text-sm text-gray-700 mb-2">Your work email</label>
        <input type="email" id="forgotEmail" autocomplete="email"
               class="input-glow w-full px-4 py-3 rounded-xl bg-white border border-gray-200 text-gray-900 placeholder-gray-400 outline-none transition-all"
               placeholder="you@company.com">
        <button type="button" id="forgotSend"
                class="w-full mt-3 py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-xl transition-colors">
          Email me a reset link
        </button>
        <p id="forgotMsg" class="hidden mt-3 text-sm text-center text-gray-500"></p>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-sm text-gray-400 hover:text-gray-600 transition-colors inline-flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Billing
      </a>
    </div>
  </div>

  <script>
    // Staff and the account holder now share one sign-in page and one portal.
    // This page is kept only so existing bookmarks and saved links still land
    // somewhere sensible.
    window.location.replace('/login.html' + window.location.search);

    var userLocation = { lat: 0, lng: 0, label: '' };

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          userLocation.lat = pos.coords.latitude;
          userLocation.lng = pos.coords.longitude;
          document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span class="text-emerald-600/80">Location detected</span>';
          fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + userLocation.lat + '&lon=' + userLocation.lng, { credentials: 'omit' })
            .then(function(r) { return r.json(); }).then(function(d) { userLocation.label = d.display_name || ''; }).catch(function() {});
        },
        function() {
          document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-amber-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg><span class="text-amber-600/80">Location access denied. You can still sign in.</span>';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-amber-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg><span class="text-amber-600/80">Geolocation not supported</span>';
    }

    function togglePassword() {
      var inp = document.getElementById('password');
      var o = document.getElementById('eyeOpen');
      var c = document.getElementById('eyeClosed');
      if (inp.type === 'password') { inp.type = 'text'; o.classList.add('hidden'); c.classList.remove('hidden'); }
      else { inp.type = 'password'; o.classList.remove('hidden'); c.classList.add('hidden'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var txt = document.getElementById('btnText');
      var spinner = document.getElementById('btnSpinner');
      var err = document.getElementById('errorMsg');
      btn.disabled = true; txt.classList.add('hidden'); spinner.classList.remove('hidden'); err.classList.add('hidden');
      try {
        var res = await fetch('/api/employee/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            latitude: userLocation.lat, longitude: userLocation.lng,
            location_label: userLocation.label, device_info: navigator.userAgent,
          }),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        window.location.href = '/employee-dashboard.html';
      } catch (e) {
        err.textContent = e.message; err.classList.remove('hidden');
      } finally {
        btn.disabled = false; txt.classList.remove('hidden'); spinner.classList.add('hidden');
      }
    }

    // --- forgotten password -------------------------------------------------
    document.getElementById('forgotLink').addEventListener('click', function () {
      var box = document.getElementById('forgotBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        var email = document.getElementById('email');
        document.getElementById('forgotEmail').value = email ? email.value : '';
        document.getElementById('forgotEmail').focus();
      }
    });

    document.getElementById('forgotSend').addEventListener('click', async function () {
      var btn = this;
      var msg = document.getElementById('forgotMsg');
      var address = document.getElementById('forgotEmail').value.trim();
      if (!address) { msg.textContent = 'Enter your work email first.'; msg.classList.remove('hidden'); return; }
      btn.disabled = true;
      try {
        var res = await fetch('/api/employee/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: address })
        });
        var data = await res.json().catch(function () { return {}; });
        // The server answers the same either way, so this never reveals
        // whether the address has an account.
        msg.textContent = res.ok
          ? (data.message || 'If that email has an account, a reset link is on its way.')
          : (data.detail || 'Try again in a moment.');
      } catch (e) {
        msg.textContent = 'Something went wrong. Try again.';
      }
      msg.classList.remove('hidden');
      btn.disabled = false;
    });
  </script>
</body>
</html>
