<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Super Admin Login - Billing</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f8fafc">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.15), transparent);
        }
        .auth-container { width: 100%; max-width: 400px; padding: 24px; }
        .auth-card {
            background: rgba(248, 250, 252, 0.95);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.1);
            text-align: center;
        }
        .brand { margin-bottom: 40px; }
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #7877c6, #2563eb);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }
        .brand h1 { font-size: 1.3rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .brand p { font-size: 0.85rem; color: #94a3b8; }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 10px;
            color: #1e293b;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus { border-color: #2563eb; }
        .form-input::placeholder { color: #475569; }
        .btn-password {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #7877c6, #2563eb);
            color: #ffffff; border: none; border-radius: 10px; font-weight: 700;
            font-size: 0.9rem; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-password:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,0.25); }
        .divider {
            display: flex; align-items: center; gap: 12px; margin: 20px 0;
            color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.08); }
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px; background: #fff; color: #333;
            border-radius: 10px; font-weight: 600; font-size: 0.95rem;
            text-decoration: none; transition: all 0.2s; border: 1px solid #e2e8f0;
            cursor: pointer; font-family: inherit;
        }
        .btn-google:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .link-home { margin-top: 24px; }
        .link-home a { color: #64748b; text-decoration: none; font-size: 0.8rem; }
        .link-home a:hover { color: #2563eb; }
        .hint { margin-top: 20px; font-size: 0.78rem; color: #475569; }
    </style>
    <link rel="stylesheet" href="mobile.css?v=43">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon">SA</div>
                <h1>Super Admin</h1>
                <p>Billing</p>
            </div>
            <div class="error-msg" id="error-msg"></div>
            <form onsubmit="passwordLogin(event)" class="text-left">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" class="form-input" id="login-id" placeholder="admin@example.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="login-password" placeholder="Password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-password">Sign In</button>
            </form>
            <p class="hint">Sign in with your superadmin email and password.</p>
            <div class="link-home"><a href="/">← Back to home</a></div>
        </div>
    </div>
    <script>
        fetch('/api/superadmin/me').then(r => { if (r.ok) window.location.href = '/superadmin.html'; }).catch(() => {});
        var params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'not_admin') {
            document.getElementById('error-msg').textContent = 'This Google account is not registered as a super admin.';
            document.getElementById('error-msg').style.display = 'block';
        }
        function showError(msg) {
            var el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }
        async function passwordLogin(e) {
            e.preventDefault();
            var identifier = document.getElementById('login-id').value.trim();
            var password = document.getElementById('login-password').value;
            if (!identifier || !password) { showError('Enter your email and password.'); return; }
            var btn = e.target.querySelector('button');
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                var res = await fetch('/api/superadmin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: identifier, password: password })
                });
                if (res.ok) {
                    window.location.href = '/superadmin.html';
                } else {
                    var data = await res.json().catch(() => ({}));
                    showError(data.detail || 'Invalid credentials. Try the Google sign-in instead.');
                    btn.disabled = false; btn.textContent = 'Sign In';
                }
            } catch (err) {
                showError('Network error. Try again.');
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
