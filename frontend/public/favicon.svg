<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Y ERP">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2142"/>
      <stop offset="0.55" stop-color="#10132a"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecd09a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.6" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffcc70"/>
      <stop offset="1" stop-color="#e5611a"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- the Y, cut in two down its middle: ivory on the left, amber on the right -->
  <polygon points="96,100 172,100 252,228 252,424 224,424 224,304" fill="url(#ivory)"/>
  <polygon points="416,100 340,100 260,228 260,424 288,424 288,304" fill="url(#amber)"/>

  <!-- a cut gem set in the fork -->
  <polygon points="256,142 273,190 256,230 239,190" fill="url(#gem)"/>
  <polygon points="256,142 273,190 256,230 239,190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round"/>
  <line x1="256" y1="142" x2="256" y2="230" stroke="#e5611a" stroke-opacity="0.35" stroke-width="2"/>
</svg>
